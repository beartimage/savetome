# Must match the existing deployed Worker that owns the saveto.me custom domain.
name = "savetome-website"
main = "worker.js"
compatibility_date = "2024-11-01"

# Static SPA assets. The Worker (worker.js) handles /api/*; everything else
# is served from here via the ASSETS binding.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# D1 database — created via `wrangler d1 create d1savetome`.
[[d1_databases]]
binding = "DB"
database_name = "d1savetome"
database_id = "67df25cb-9eda-4fbf-bea6-1ca3415237f5"

# Public (non-secret) OAuth client IDs. Secrets are set separately with
# `wrangler secret put` — see SETUP.md. Do NOT put client secrets here.
[vars]
GOOGLE_CLIENT_ID = "912323810168-bnl6fpdhr7t37j0vgjbethhuamua6pbk.apps.googleusercontent.com"
GITHUB_CLIENT_ID = "Ov23liThVYH9vb2uTG6N"
