<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saveme.to — Smart Bookmark Manager</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    :root {
      --bg-page: #F1F5F9;
      --bg-sidebar: #FFFFFF;
      --bg-card: #FFFFFF;
      --border-subtle: #E2E8F0;
      --border-focus: #818CF8;
      
      --text-main: #0F172A;
      --text-sub: #475569;
      --text-muted: #94A3B8;
      
      --brand-gradient: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      --brand-primary: #6366F1;
      --brand-soft: #EEF2FF;
      --brand-text: #4338CA;
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      
      --shadow-flat: 0 2px 4px 0 rgba(15, 23, 42, 0.04);
      --shadow-hover: 0 10px 25px -5px rgba(99, 102, 241, 0.12), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Vibrant Sidebar */
    aside {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      color: var(--text-main);
      font-size: 18px;
      letter-spacing: -0.5px;
      margin-bottom: 36px;
      padding-left: 4px;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      background: var(--brand-gradient);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFF;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    .nav-section {
      margin-bottom: 28px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-left: 6px;
      padding-right: 4px;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: #818CF8;
    }

    .add-project-btn {
      background: #EEF2FF;
      color: var(--brand-primary);
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .add-project-btn:hover {
      background: var(--brand-primary);
      color: #FFF;
    }

    .nav-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      color: var(--text-sub);
      font-size: 13.5px;
      font-weight: 600;
      margin-bottom: 4px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }

    .nav-item:hover {
      background-color: #F8FAFC;
      color: var(--brand-primary);
      transform: translateX(2px);
    }

    .nav-item.active {
      background: var(--brand-gradient);
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
    }

    /* Drag over highlight for folders */
    .nav-item.drag-over {
      background: #E0E7FF !important;
      border: 2px dashed var(--brand-primary);
      color: var(--brand-primary) !important;
      transform: scale(1.02);
    }

    .badge {
      font-size: 11px;
      background: #E0E7FF;
      color: #3730A3;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 700;
      pointer-events: none;
    }

    .nav-item.active .badge {
      background: rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
    }

    /* Workspace Header & Controls */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      height: 76px;
      background-color: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .search-bar {
      width: 100%;
      max-width: 540px;
    }

    .search-input {
      width: 100%;
      background-color: var(--bg-page);
      border: 1.5px solid transparent;
      border-radius: var(--radius-md);
      padding: 11px 18px;
      color: var(--text-main);
      font-size: 13.5px;
      font-weight: 500;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      background-color: #FFFFFF;
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    .controls-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .view-switcher {
      display: flex;
      background: var(--bg-page);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 4px;
      gap: 3px;
    }

    .view-btn-text {
      background: transparent;
      border: none;
      color: var(--text-sub);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .view-btn-text.active {
      background: #FFFFFF;
      color: var(--brand-primary);
      box-shadow: var(--shadow-flat);
    }

    .view-btn-icon {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .view-btn-icon svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .view-btn-icon:hover {
      color: var(--brand-primary);
    }

    .view-btn-icon.active {
      background: #FFFFFF;
      color: var(--brand-primary);
      box-shadow: var(--shadow-flat);
    }

    /* Content Layout */
    .content-container {
      flex: 1;
      padding: 32px 36px;
      overflow-y: auto;
    }

    /* Link Cards Base */
    .link-item {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-flat);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      cursor: grab;
    }

    .link-item:active {
      cursor: grabbing;
    }

    .link-item.dragging {
      opacity: 0.4;
      transform: scale(0.98);
    }

    .link-item:hover {
      border-color: #C7D2FE;
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    /* LIST - COMPACT MODE */
    .view-list.mode-compact {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .view-list.mode-compact .link-item {
      border-radius: var(--radius-md);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .view-list.mode-compact .item-description,
    .view-list.mode-compact .item-note {
      display: none !important;
    }

    /* LIST - DETAILED MODE */
    .view-list.mode-detailed {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .view-list.mode-detailed .link-item {
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      display: flex;
      align-items: flex-start;
      gap: 20px;
      border-left: 4px solid var(--brand-primary);
    }

    .view-list.mode-detailed .item-description {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 6px;
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.5;
    }

    .view-list.mode-detailed .item-note {
      display: inline-block;
      font-size: 12px;
      font-weight: 500;
      color: #92400E;
      background: #FEF3C7;
      border: 1px solid #FDE68A;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      outline: none;
      margin-top: 12px;
      transition: all 0.15s ease;
    }

    .view-list.mode-detailed .item-note:hover, 
    .view-list.mode-detailed .item-note:focus {
      border-color: #F59E0B;
      background: #FEF3C7;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
    }

    /* GRID VIEW */
    .view-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      align-items: start;
      gap: 22px;
    }

    .view-grid .link-item {
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 290px;
      justify-content: space-between;
      overflow: hidden;
      border-top: 4px solid var(--brand-primary);
    }

    .view-grid .item-site {
      width: 100%;
      margin-bottom: 12px;
    }

    .view-grid .item-main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }

    .view-grid .item-title {
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    .view-grid .item-description {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: 12.5px;
      color: var(--text-sub);
      line-height: 1.45;
    }

    .view-grid .item-note {
      font-size: 12px;
      font-weight: 500;
      color: #92400E;
      background: #FEF3C7;
      border: 1px solid #FDE68A;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      outline: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: auto;
    }

    .view-grid .item-meta {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .view-grid .delete-btn {
      margin-left: auto;
    }

    /* Element Styles */
    .item-site {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 130px;
      flex-shrink: 0;
    }

    .item-favicon {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: var(--bg-page);
      flex-shrink: 0;
    }

    .item-domain {
      font-size: 12.5px;
      color: var(--text-sub);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-decoration: none;
    }

    .item-domain:hover {
      color: var(--brand-primary);
    }

    .item-main-content {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.15s ease;
    }

    .item-title:hover {
      color: var(--brand-primary);
    }

    .item-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      margin-left: auto;
    }

    /* COLORFUL TAG STYLES */
    .tag {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .tag-project {
      background: #ECE9FE;
      color: #5B21B6;
    }

    .tag-design {
      background: #FCE7F3;
      color: #9D174D;
    }

    .tag-dev {
      background: #E0E7FF;
      color: #3730A3;
    }

    .tag-db {
      background: #D1FAE5;
      color: #065F46;
    }

    .tag-ai {
      background: #FFEDD5;
      color: #9A3412;
    }

    .tag-default {
      background: #F1F5F9;
      color: #475569;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      transition: all 0.15s ease;
    }

    .delete-btn:hover {
      color: #DC2626;
      background-color: #FEE2E2;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside>
    <div class="brand">
      <div class="brand-mark">S</div> saveme.to
    </div>

    <div class="nav-section">
      <div class="nav-item active" id="nav-all" onclick="showAll()">
        <span>All Links</span>
        <span class="badge" id="count-all">0</span>
      </div>
    </div>

    <div class="nav-section">
      <div class="section-header">
        <span class="section-title">Projects</span>
        <button class="add-project-btn" onclick="addNewProject()" title="Add New Project">+</button>
      </div>
      <div id="project-list"></div>
    </div>
  </aside>

  <!-- Main Workspace -->
  <main>
    <header>
      <div class="search-bar">
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Paste URL to save, or search links... (Press Enter)"
          onkeydown="handleInput(event)"
        />
      </div>

      <div class="controls-group">
        <!-- Compact / Detailed Mode Switcher -->
        <div class="view-switcher">
          <button class="view-btn-text active" id="btnCompact" onclick="setDetailMode('compact')">Compact</button>
          <button class="view-btn-text" id="btnDetailed" onclick="setDetailMode('detailed')">Detailed</button>
        </div>

        <!-- Grid / List Layout Switcher -->
        <div class="view-switcher">
          <button class="view-btn-icon active" id="btnList" onclick="setLayout('list')" title="List View">
            <svg viewBox="0 0 16 16"><path d="M2 3.5a.5.5 0 01.5-.5h11a.5.5 0 010 1h-11a.5.5 0 01-.5-.5zm0 4.5a.5.5 0 01.5-.5h11a.5.5 0 010 1h-11a.5.5 0 01-.5-.5zm0 4.5a.5.5 0 01.5-.5h11a.5.5 0 010 1h-11a.5.5 0 01-.5-.5z"/></svg>
          </button>
          <button class="view-btn-icon" id="btnGrid" onclick="setLayout('grid')" title="Grid View">
            <svg viewBox="0 0 16 16"><path d="M1 2.5A1.5 1.5 0 012.5 1h3A1.5 1.5 0 017 2.5v3A1.5 1.5 0 015.5 7h-3A1.5 1.5 0 011 5.5v-3zm8 0A1.5 1.5 0 0110.5 1h3A1.5 1.5 0 0115 2.5v3A1.5 1.5 0 0113.5 7h-3A1.5 1.5 0 019 5.5v-3zm-8 8A1.5 1.5 0 012.5 9h3A1.5 1.5 0 017 10.5v3A1.5 1.5 0 015.5 15h-3A1.5 1.5 0 011 13.5v-3zm8 0A1.5 1.5 0 0110.5 9h3a1.5 1.5 0 011.5 1.5v3a1.5 1.5 0 01-1.5 1.5h-3A1.5 1.5 0 019 13.5v-3z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <div class="content-container view-list mode-compact" id="linkList"></div>
  </main>

  <script>
    let currentLayout = 'list';
    let currentDetailMode = 'compact';
    let activeFilter = null;
    let draggedItemId = null;

    let customProjects = ["BeArt UI Redesign", "Dev Tools", "General"];

    let items = [
      {
        id: 1,
        url: "https://dribbble.com/shots/26940926-Bloggo",
        title: "Bloggo — Dashboard for SaaS AI Blog Automation Platform",
        domain: "dribbble.com",
        description: "Bloggo helps creators stay in control of their content workflow with automated AI blogging pipelines and sleek card UI.",
        autoTags: ["Design", "SaaS", "AI"],
        note: "Primary clean design reference for Saveme.to UI",
        project: "BeArt UI Redesign"
      },
      {
        id: 2,
        url: "https://supabase.com",
        title: "Supabase | The Open Source Firebase Alternative",
        domain: "supabase.com",
        description: "Build production-ready apps with Postgres database, Authentication, Instant APIs, Realtime subscriptions, and Storage.",
        autoTags: ["Database", "Postgres", "Backend"],
        note: "Use for multi-device cloud database sync",
        project: "Dev Tools"
      },
      {
        id: 3,
        url: "https://github.com",
        title: "GitHub: Let’s build from here",
        domain: "github.com",
        description: "Complete developer platform to build, scale, and deliver secure software with GitHub Pages hosting.",
        autoTags: ["Dev", "Code", "Hosting"],
        note: "Deploy static HTML directly to GitHub Pages",
        project: "Dev Tools"
      }
    ];

    function updateContainerClasses() {
      const container = document.getElementById('linkList');
      container.className = `content-container view-${currentLayout} mode-${currentDetailMode}`;
    }

    function setLayout(mode) {
      currentLayout = mode;
      document.getElementById('btnGrid').classList.toggle('active', mode === 'grid');
      document.getElementById('btnList').classList.toggle('active', mode === 'list');
      updateContainerClasses();
    }

    function setDetailMode(mode) {
      currentDetailMode = mode;
      document.getElementById('btnDetailed').classList.toggle('active', mode === 'detailed');
      document.getElementById('btnCompact').classList.toggle('active', mode === 'compact');
      updateContainerClasses();
    }

    function generateLinkMetadata(url, domain, path) {
      const lower = (domain + path).toLowerCase();
      let autoTags = ["Web"];
      let description = `Saved resource from ${domain}. Direct link to ${path || 'homepage'}.`;

      if (lower.includes('github') || lower.includes('dev') || lower.includes('code')) {
        autoTags = ["Code", "DevTools"];
        description = "Developer repository, tool, or code resource.";
      } else if (lower.includes('dribbble') || lower.includes('figma') || lower.includes('design')) {
        autoTags = ["Design", "UI/UX"];
        description = "Design inspiration, prototype, or UI component.";
      } else if (lower.includes('youtube') || lower.includes('video')) {
        autoTags = ["Video", "Media"];
        description = "Online video content or media link.";
      }

      return { autoTags, description };
    }

    function getTagColorClass(tag) {
      const lower = tag.toLowerCase();
      if (lower.includes('design') || lower.includes('ui') || lower.includes('saas')) return 'tag-design';
      if (lower.includes('dev') || lower.includes('code') || lower.includes('backend') || lower.includes('hosting')) return 'tag-dev';
      if (lower.includes('database') || lower.includes('postgres')) return 'tag-db';
      if (lower.includes('ai')) return 'tag-ai';
      return 'tag-default';
    }

    function addNewProject() {
      const name = prompt("Enter new project name:");
      if (name && name.trim()) {
        const cleanName = name.trim();
        if (!customProjects.includes(cleanName)) {
          customProjects.push(cleanName);
          renderSidebarProjects();
        }
      }
    }

    /* Renders sidebar project list with Drag and Drop targets */
    function renderSidebarProjects() {
      const projectContainer = document.getElementById('project-list');
      projectContainer.innerHTML = '';

      // Collect custom created projects + any existing item projects
      const allProjects = [...new Set([...customProjects, ...items.map(item => item.project)])].filter(Boolean);

      allProjects.forEach(projectName => {
        const projectCount = items.filter(i => i.project === projectName).length;
        const div = document.createElement('div');
        div.className = `nav-item ${activeFilter === projectName ? 'active' : ''}`;
        
        // Click to filter
        div.onclick = () => filterProject(projectName);

        // Drag and drop events on sidebar project folders
        div.ondragover = (e) => {
          e.preventDefault();
          div.classList.add('drag-over');
        };

        div.ondragleave = () => {
          div.classList.remove('drag-over');
        };

        div.ondrop = (e) => {
          e.preventDefault();
          div.classList.remove('drag-over');
          if (draggedItemId) {
            const item = items.find(i => i.id === draggedItemId);
            if (item) {
              item.project = projectName;
              renderItems(activeFilter ? items.filter(i => i.project === activeFilter) : items);
            }
          }
        };

        div.innerHTML = `
          <span>📁 ${projectName}</span>
          <span class="badge">${projectCount}</span>
        `;
        projectContainer.appendChild(div);
      });
    }

    function renderItems(itemList) {
      const list = document.getElementById('linkList');
      list.innerHTML = '';
      document.getElementById('count-all').innerText = items.length;

      itemList.forEach(item => {
        const div = document.createElement('div');
        div.className = 'link-item';
        div.draggable = true;

        // Drag handlers for bookmark cards
        div.ondragstart = (e) => {
          draggedItemId = item.id;
          div.classList.add('dragging');
          e.dataTransfer.setData('text/plain', item.id);
        };

        div.ondragend = () => {
          draggedItemId = null;
          div.classList.remove('dragging');
        };

        div.innerHTML = `
          <div class="item-site">
            <img class="item-favicon" src="https://www.google.com/s2/favicons?domain=${item.domain}&sz=32" alt="icon" />
            <a href="${item.url}" target="_blank" class="item-domain" title="Open link in new tab">${item.domain}</a>
          </div>

          <div class="item-main-content">
            <a href="${item.url}" target="_blank" class="item-title" title="Open link in new tab">${item.title}</a>
            <div class="item-description">${item.description}</div>
            <div 
              class="item-note" 
              contenteditable="true" 
              onblur="updateNote(${item.id}, this.innerText)" 
              onkeydown="handleNoteKey(event)"
              title="Click to edit note"
            >${item.note || 'Click to add note...'}</div>
          </div>

          <div class="item-meta">
            <span class="tag tag-project">📁 ${item.project}</span>
            ${item.autoTags.map(tag => `<span class="tag ${getTagColorClass(tag)}">#${tag}</span>`).join('')}
            <button class="delete-btn" onclick="deleteItem(${item.id})">✕</button>
          </div>
        `;
        list.appendChild(div);
      });

      renderSidebarProjects();
    }

    function updateNote(id, newText) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.note = newText.trim();
      }
    }

    function handleNoteKey(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        e.target.blur();
      }
    }

    function handleInput(e) {
      if (e.key === 'Enter') {
        const value = e.target.value.trim();
        if (!value) return;

        if (value.startsWith('http://') || value.startsWith('https://')) {
          try {
            const parsedUrl = new URL(value);
            const { autoTags, description } = generateLinkMetadata(value, parsedUrl.hostname, parsedUrl.pathname);
            
            const newItem = {
              id: Date.now(),
              url: value,
              title: parsedUrl.hostname + (parsedUrl.pathname !== '/' ? parsedUrl.pathname : ''),
              domain: parsedUrl.hostname,
              description: description,
              autoTags: autoTags,
              note: "Click to add note...",
              project: activeFilter || "General"
            };

            items.unshift(newItem);
            
            if (activeFilter && activeFilter !== newItem.project) {
              showAll();
            } else {
              renderItems(activeFilter ? items.filter(i => i.project === activeFilter) : items);
            }
            
            e.target.value = '';
          } catch (err) {
            alert('Invalid URL format');
          }
        }
      }
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      if (!query.startsWith('http')) {
        const filtered = items.filter(i => 
          i.title.toLowerCase().includes(query) || 
          i.description.toLowerCase().includes(query) ||
          i.note.toLowerCase().includes(query) ||
          i.domain.toLowerCase().includes(query) ||
          i.autoTags.some(t => t.toLowerCase().includes(query))
        );
        renderItems(filtered);
      }
    });

    function deleteItem(id) {
      items = items.filter(i => i.id !== id);
      if (activeFilter) {
        renderItems(items.filter(i => i.project === activeFilter));
      } else {
        renderItems(items);
      }
    }

    function filterProject(projectName) {
      activeFilter = projectName;
      document.getElementById('nav-all').classList.remove('active');
      const filtered = items.filter(i => i.project === projectName);
      renderItems(filtered);
    }

    function showAll() {
      activeFilter = null;
      document.getElementById('nav-all').classList.add('active');
      renderItems(items);
    }

    renderItems(items);
  </script>
</body>
</html>
